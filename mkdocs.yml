site_name: VibeDiff
site_description: A local Git/Jujutsu diff viewer for reviewing AI-written code
repo_url: https://github.com/meain/vibediff
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - Installation: installation.md
  - Workflows: workflows.md
  - Usage: usage.md
  - Agent integration: agent-integration.md
  - Development: development.md
